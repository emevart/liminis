name: LAB reader EOF lifecycle diagnostic evidence only

on:
  push:
    branches: [codex/lab-reader-lifecycle-run-20261005]

permissions:
  contents: read

concurrency:
  group: lab-transport-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: protected original LAB reader lifecycle diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /scripts/check_lab_transport_diagnostic.mjs
            /scripts/lab-transport-diagnostic-assets.json
            /site/lab.html
            /site/lab.js
            /site/lab.css
            /site/lab-data.mjs
            /site/data/lab-2/
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch fixed source candidate and verify original asset bytes
        run: |
          git fetch --filter=blob:none --no-tags --depth=1 origin 1be0d0940ef75aa00d6152e5b718df0cc5fb446f
          node scripts/check_lab_transport_diagnostic.mjs --source-preflight-only
      - name: Install unchanged official protected browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/liminis-lab-transport-diagnostic" --no-save --package-lock=false playwright@1.61.1
          "$RUNNER_TEMP/liminis-lab-transport-diagnostic/node_modules/.bin/playwright" install --with-deps chromium
      - name: Observe one original positive response lifecycle and initial page
        env:
          LIMINIS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/liminis-lab-transport-diagnostic/node_modules/playwright
          LIMINIS_EXPECTED_HEAD: ${{ github.sha }}
        run: LIMINIS_EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')" node scripts/check_lab_transport_diagnostic.mjs
      - name: Preserve original diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-reader-lifecycle-diagnostic-${{ github.sha }}
          path: target/qa/lab-transport-diagnostic/
          if-no-files-found: error
          retention-days: 7
