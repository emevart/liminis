name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  site:
    name: recorded observer data contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the public recording and reject incomplete data
        run: node --test site/recording.test.mjs

  check:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup honours rust-toolchain.toml, so this installs the pinned
      # compiler and prints which one the rest of the job runs on. The toolchain
      # version is part of reproducibility, alongside seed and config (ADR-024).
      - name: Toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Recorded exporter tests
        run: cargo test -p liminis --example export_cell_replay

  # The rule is old, the check is not: NUMERIC.md section 8 asks for "a linter or
  # a grep in CI, rather than a line in CLAUDE.md". The PostToolUse hook greps
  # the same thing, but only inside a Claude Code session — a pull request from
  # anyone else was passing this rule by. Both call scripts/check_bare_q.py, so
  # there is one implementation and not two that drift apart in silence.
  #
  # The type is the first line of defence and needs no job: Q implements no
  # Deref and exposes no field, so `a * b` over two Q does not compile. This is
  # the second line, for what the type cannot see — unwrapping through .0, and
  # WGSL templates, which have no type system at all.
  numeric:
    name: no bare arithmetic over Q (ADR-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Passes while kernels/ is still empty: an empty directory is the normal
      # state of the project until the first kernel (ADR-032), not a failure.
      - name: Kernels and WGSL templates go through the wrappers
        run: python3 scripts/check_bare_q.py

  # A hook that quietly lets through what it should block is worse than no hook,
  # so the hooks have tests. Those tests ran on Linux only, which left the one
  # platform they were hardened for untested: .gitattributes forces LF on
  # checkout because bash refuses a shebang with a trailing carriage return, and
  # that is a statement about a Windows clone. macOS is here for the other
  # promise in the script — an old bash and a BSD userland.
  hooks:
    name: hook tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The last hook test runs kernel-lint against the real repository, and
      # that hook shells out to cargo fmt and cargo clippy. This materialises
      # the pinned toolchain before the test needs it, on every platform.
      - name: Toolchain
        run: rustup show

      # The tests execute each hook through its shebang, and the shebang says
      # python3. The Windows image ships python.exe; python3.exe next to it is
      # not something to rely on, and a missing interpreter would fail the run
      # for a reason that has nothing to do with the guards.
      - name: python3 in PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail

          if command -v python3 >/dev/null; then
            echo "python3 already resolves to $(command -v python3)"
            exit 0
          fi

          python="$(command -v python || true)"
          if [ -z "$python" ]; then
            echo "::error::neither python3 nor python is in PATH; the hooks cannot run"
            exit 1
          fi

          # python.exe finds its standard library next to itself, so the copy
          # has to stay in the same directory. A wrapper elsewhere on PATH is
          # the fallback for when that directory is read-only.
          if cp "$python" "$(dirname "$python")/python3.exe" 2>/dev/null; then
            echo "copied $python next to itself as python3.exe"
          else
            shim="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim"
            printf '#!/bin/sh\nexec python "$@"\n' >"$shim/python3"
            chmod +x "$shim/python3"
            cygpath -w "$shim" >>"$GITHUB_PATH"
            echo "wrapped python as $shim/python3"
          fi

      # TMPDIR on Windows: the script builds a fake repository under mktemp -d
      # and hands its path to the hooks, which run on native Windows Python.
      # Git Bash hands out /tmp/... paths, and that Python resolves them against
      # the current drive instead — the fake repository would look empty, the
      # guards would look silent, and the tests would pass for the wrong reason.
      # cygpath -m gives a path both halves read the same way.
      - name: Hook tests
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = Windows ]; then
            TMPDIR="$(cygpath -m "$RUNNER_TEMP")"
            export TMPDIR
          fi

          scripts/test-hooks.sh

  world-version:
    name: world semantics version (ADR-020)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A change to a config, a kernel, the tick order or the random mixer
      # changes what the numbers mean, and old runs stop being comparable to new
      # ones. Refactoring that preserves behaviour changes the code version and
      # leaves this one alone; anything that touches dynamics has to move it.
      #
      # numeric/rng.rs joined the list with ADR-058, and it is the one entry
      # that is a single file rather than a tree: every stochastic rounding of
      # reaction extent draws from it (ADR-027), so a changed mixer is a changed
      # world exactly like a changed kernel. The rest of numeric/ is deliberately
      # not here — the wrappers are semantics too, but they are covered by their
      # own tests, and a guard that fires on every touch of the module would be
      # a guard people learn to bump past.
      #
      # The pattern is also the whole guard. `|| true` below swallows grep's
      # exit status, so a typo in one alternative does not fail the step: it
      # empties `sensitive`, prints "No changes" and exits zero, switching the
      # guard off for configs/, kernels/ and process/ as well, in silence. Hence
      # the `$` and the escaped dot on the file entry, and hence a dry run of
      # this pipeline against a made-up file list before changing it.
      - name: WORLD_FORMAT_VERSION must move with the semantics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          sensitive="$(printf '%s\n' "$changed" \
            | grep -E '^(configs/|crates/liminis-core/src/((kernels|process|worldgen)/|numeric/rng\.rs$))' || true)"

          if [ -z "$sensitive" ]; then
            echo "No configs/**, kernels/**, process/**, worldgen/** or numeric/rng.rs changes here."
            exit 0
          fi

          echo "This pull request touches world semantics:"
          printf '  %s\n' $sensitive

          bumped="$(git diff "$BASE_SHA" HEAD -- crates/liminis-core/src/version.rs \
            | grep -c '^[+-]pub const WORLD_FORMAT_VERSION' || true)"

          if [ "$bumped" -eq 0 ]; then
            echo
            echo "::error::WORLD_FORMAT_VERSION was not changed (ADR-020)."
            echo "A change under configs/**, crates/liminis-core/src/kernels/**,"
            echo "crates/liminis-core/src/process/** or"
            echo "crates/liminis-core/src/worldgen/**, or to"
            echo "crates/liminis-core/src/numeric/rng.rs, changes what a run"
            echo "means, so results from before and after this pull request"
            echo "cannot go on the same plot. Bump the constant in"
            echo "crates/liminis-core/src/version.rs."
            echo
            echo "process/** counts because the order of processes inside a tick"
            echo "is part of the world semantics: with Lie-Trotter splitting the"
            echo "result depends on it, so swapping two processes has to move the"
            echo "version even though no config and no kernel changed (ADR-036,"
            echo "SPEC section 8)."
            echo
            echo "numeric/rng.rs counts because the extent of every reaction is"
            echo "rounded stochastically off that generator (ADR-027): a changed"
            echo "mixer, a changed counter list or a changed start constant"
            echo "changes every draw, hence every xi, hence every run (ADR-058)."
            echo
            echo "worldgen/** counts because it decides the state every tick"
            echo "starts from: the purpose window, the octave spectrum and the"
            echo "band an initial condition wanders inside all enter the draws,"
            echo "so a change there gives a different world under the same seed"
            echo "and the same scenario (SPEC section 12.4, ADR-021, ADR-058)."
            echo
            echo "If this change genuinely cannot affect dynamics, say so in the"
            echo "pull request description and record why."
            exit 1
          fi

          echo
          echo "WORLD_FORMAT_VERSION moved. Good."

  frozen-docs:
    name: frozen documents (ADR-032)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The freeze has a mechanical trigger: the first file under kernels/ means
      # implementation started, and from that moment SPEC.md and NORTH_STAR.md
      # are read-only. The PreToolUse hook of the same name enforces it inside a
      # Claude Code session, and only for Write and Edit — a human, or a shell
      # redirect, walks straight past it. This is the same rule where everything
      # lands anyway.
      #
      # A hidden file is not a start: .gitkeep exists so that an empty directory
      # reaches git at all. Same reading as in the hook.
      #
      # The check is per commit, not per pull request, and that distinction is
      # the whole rule. The freeze is in force for a commit whose PARENT
      # already carries a kernel — because it is the first kernel file that
      # closes the window, so everything after that commit is frozen and
      # everything at or before it is not. A pull request that first brings the
      # spec in line and then lands the first kernel is exactly the intended
      # sequence; judging it by its final tree would forbid the one workflow
      # ADR-032 describes.
      - name: SPEC and NORTH_STAR are frozen once the first kernel exists
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # `|| true` is load-bearing under `set -o pipefail`: when the parent
          # carries no kernel at all — which is the normal case while the window
          # is open — git prints nothing, grep finds nothing and exits 1, and
          # the whole script would die instead of reporting an open window.
          kernel_in() {
            git ls-tree -r --name-only "$1" -- crates/liminis-core/src/kernels \
              | { grep -vE '(^|/)\.' || true; } | head -n 1
          }

          violation=0
          for sha in $(git rev-list --reverse "$BASE_SHA..HEAD"); do
            frozen="$(git diff-tree --no-commit-id --name-only -r "$sha" \
              | grep -E '^docs/(SPEC|NORTH_STAR)\.md$' || true)"
            [ -z "$frozen" ] && continue

            parent="$(git rev-parse "$sha^")"
            started="$(kernel_in "$parent")"

            if [ -z "$started" ]; then
              echo "$sha: window still open, edits allowed:"
              printf '    %s\n' $frozen
              continue
            fi

            echo "::error::$sha edits a frozen document (ADR-032)."
            printf '    %s\n' $frozen
            echo "    the freeze was already closed by: $started"
            violation=1
          done

          if [ "$violation" -ne 0 ]; then
            echo
            echo "The freeze starts with the first file under"
            echo "crates/liminis-core/src/kernels/, and from that point"
            echo "docs/SPEC.md and docs/NORTH_STAR.md are not edited at all."
            echo "A new idea goes to docs/OPEN_QUESTIONS.md; a new decision goes"
            echo "to the end of docs/DECISIONS.md."
            exit 1
          fi

          echo "No commit edits a frozen document after the freeze closed."

      # docs/archive/** is frozen for a different reason and unconditionally:
      # these are superseded drafts that contradict the current spec, so they
      # are neither edited nor cited at any stage of the project (ADR-032).
      - name: docs/archive stays superseded
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          touched="$(git diff --name-only "$BASE_SHA" HEAD \
            | grep -E '^docs/archive/' || true)"

          if [ -z "$touched" ]; then
            echo "This pull request leaves docs/archive/ alone."
            exit 0
          fi

          echo "::error::docs/archive/** is frozen unconditionally (ADR-032)."
          printf '  %s\n' $touched
          echo
          echo "Superseded drafts are kept as history. If something in there is"
          echo "still true, it belongs in the current documents, not in a patch"
          echo "to the draft."
          exit 1
