# Growth: 2 CH2O(food) + O2 -> CH2O(biomass) + CO2 + H2O.
# Each event retains half the food carbon as biomass.
# Formation enthalpies give -459340 J/mol extent for every offspring branch.
# Tradeoff: higher maximum growth requires a higher food concentration.
# vmax [0.0012, 0.002, 0.0033, 0.0053, 0.0085] /s.
# FOOD half-saturation [0.002, 0.009, 0.03, 0.09, 0.25] mol/m3.
# Mutation probability 0.02: symmetric nearest neighbours inside the range;
# the boundary's whole mutant fraction goes to its only neighbour.

[[reaction]]
id = "grow_harvester_harvester"
inputs = { FOOD = 2, O2 = 1 }
outputs = { HARVESTER = 1, CO2 = 1, WATER = 1 }
catalyst = "guild:HARVESTER"
enthalpy = -459340.0
[reaction.rate]
vmax = 0.001176
t_vmax = 298.15
q10 = 1.0
km = { FOOD = 0.002, O2 = 0.01 }

