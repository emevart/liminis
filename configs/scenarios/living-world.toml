# Experimental, uncalibrated eco-mode culture (ADR-091).
# Biomass is CH2O-equivalent organic carbon, not a measured microbial formula.
# All five ecotypes have identical chemistry; only inherited kinetics differ.
# Mutation creates offspring in adjacent ecotypes, never converts an adult.
# No lineage tree, individual cells, or open-ended genome evolution is claimed.
name = "living-world"
dt = 1.0
beta = 0.015625
T_ref = 298.15

[conserved]
C = 12.01070
H = 1.007940
O = 15.99940

[grid]
nx = 24
ny = 24
nz = 24
dx = 1.0e-4

[boundary]
z_min = "closed"
z_max = "exchange"

[boundary.reservoir]
t_out = 298.15
k_ex = 1.0e-6
conc_out = { WATER = 55500.0, FOOD = 0.8, O2 = 0.25, CO2 = 0.01, DET = 0.0, HARVESTER = 0.0, FORAGER = 0.0, GENERALIST = 0.0, OPPORTUNIST = 0.0, BLOOMER = 0.0 }

