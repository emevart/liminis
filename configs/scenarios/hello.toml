# Minimal scenario. Nothing here influences anything yet: there are no fields,
# no substances and no tick loop. It exists so that `liminis run` has something
# to read and hash.
#
# Scale discipline (SPEC §10): dx and dt are the only parameters allowed to
# mention the voxel. Everything added later is expressed in concentrations and
# per-kilogram rates.

name = "hello"

# Timestep, seconds. The eco tick is a second. A field whose diffusion outruns
# it subdivides its own step, n = ceil(6*D*dt/dx^2), derived at config load: the
# few fast fields pay for themselves rather than the whole world running ten
# times slower for their sake (ADR-030).
dt = 1.0

# Storage reference state for enthalpy, kelvin. Required with no default since
# ADR-044: it exists so that the bit width is not spent on a constant offset,
# and a number picked on the author's behalf would be a scenario decision made
# by the schema. Nothing reads it here — there is no enthalpy field yet — but
# every scenario has to declare one, and `every_scenario_in_the_repository_loads`
# is what says so out loud.
T_ref = 298.15

[grid]
nx = 64
ny = 64
nz = 64

# Voxel edge, metres. 1e-4 m = 100 um, the eco regime (ADR-013).
dx = 1.0e-4
