# Format-1 well-mixed chamber with individual cells (ADR-099--101).
# Parameters are an uncalibrated CH2O-equivalent prototype. The chamber has no
# spatial coordinates, gradients, diffusion, adhesion, or morphology.
chamber_format = 1
name = "cell-chamber"
dt = 30.0
extent_fraction = 0.015625

[conserved]
C = 12.01070
H = 1.007940
O = 15.99940

[chamber]
volume_m3 = 1.0e-12
temperature_k = 298.15
max_cells = 512
# Independently capped reservoir exchange, 1/s. This is not a coupled
# fixed-volume chemostat flow; each free pool approaches its declared target
# with a per-tick cap derived from that substance's max_conc.
medium_exchange_per_s = 2.0e-6

[growth]
id = "aerobic_growth"
enthalpy_j_per_extent = -459340.0
biomass_substance = "BIO"
limiting_substance = "FOOD"
inputs = { FOOD = 2, O2 = 1 }
outputs = { BIO = 1, CO2 = 1, WATER = 1 }

[death]
detritus_substance = "DET"

# Only kinetics mutates in format 1. The complete physiology below is copied
# into both daughters; no phenotype constant is supplied by the step code.
[genome]
kinetics_min = -4
kinetics_max = 4
mutation_probability = 0.02
mutation_step = 1
speed_factor_per_step = 1.35
affinity_cost_per_step = 1.8

[founder]
count = 8
structural_mass_mol = 3.0e-14
internal_energy_j = 5.0e-12

[founder.genome]
kinetics = 0
max_growth_rate_per_s = 5.0e-4
uptake_km_mol_m3 = 0.05
division_mass_mol = 6.0e-14
maintenance_power_w = 5.0e-16
capture_numerator = 1
capture_denominator = 1000
division_energy_j = 1.0e-12
starvation_tolerance_s = 3600.0

[initial.concentration]
WATER = 55500.0
FOOD = 10.0
O2 = 2.0
CO2 = 0.01
DET = 0.0
BIO = 0.0

