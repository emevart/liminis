[workspace]
resolver = "3"
members = ["crates/liminis-core", "crates/liminis"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/emevart/liminis"
readme = "README.md"
keywords = ["simulation", "artificial-life", "evolution", "ecosystem", "voxel"]
categories = ["science", "simulation"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
