<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liminis</title>
    <meta
      name="description"
      content="A voxel simulator of a biological ecosystem, built to study the major evolutionary transitions."
    />
    <link rel="canonical" href="https://liminis.dev/" />
    <style>
      :root {
        --bg: #fdfdfc;
        --fg: #191917;
        --muted: #6b6b64;
        --rule: #dcdcd6;
        --hover-bg: #191917;
        --hover-fg: #fdfdfc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121211;
          --fg: #e9e9e3;
          --muted: #8b8b82;
          --rule: #2e2e2a;
          --hover-bg: #e9e9e3;
          --hover-fg: #121211;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: clamp(2.75rem, 12vw, 4rem);
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }

      .tagline {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1rem;
        text-wrap: balance;
      }

      .status {
        margin: 2rem 0 0;
        padding-top: 1.75rem;
        border-top: 1px solid var(--rule);
        color: var(--muted);
        font-size: 0.875rem;
      }

      .cta {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid var(--fg);
        border-radius: 2px;
        color: inherit;
        font-size: 0.9375rem;
        text-decoration: none;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .cta:hover,
      .cta:focus-visible {
        background: var(--hover-bg);
        color: var(--hover-fg);
      }

      .version {
        margin: 1.5rem 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
      }

      .version a {
        color: inherit;
        text-decoration-color: var(--rule);
        text-underline-offset: 0.2em;
      }

      .version a:hover {
        text-decoration-color: currentColor;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Liminis</h1>

      <p class="tagline">
        A voxel simulator of a biological ecosystem, built to study the major
        evolutionary transitions.
      </p>

      <p class="status">Pre-S0. Nothing is simulated yet.</p>

      <!--
        The repository stays private until the project opens, so linking to it
        would send every visitor to a 404. Restore this line in place of the
        mailto below once it is public:

        <a class="cta" href="https://github.com/emevart/liminis">View on GitHub</a>
      -->
      <a class="cta" href="mailto:conduct@liminis.dev">conduct@liminis.dev</a>

      <p class="version">
        <a href="https://crates.io/crates/liminis">liminis <span id="version">0.1.0</span></a>
        on crates.io
      </p>
    </main>

    <script>
      // The hardcoded version above is what renders without JavaScript and if
      // the API is unreachable. This only replaces it on success, so the page is
      // never wrong — at worst it is behind by one release.
      fetch("https://crates.io/api/v1/crates/liminis")
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((data) => {
          const version = data?.crate?.max_version;
          if (version) document.getElementById("version").textContent = version;
        })
        .catch(() => {});
    </script>
  </body>
</html>
